<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2748d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mes Mots">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Mes Mots</title>
<style>
/* Layout: one narrow column for the phone; folders as a scrolling row of chips, then study cards or the word list. System fonts only, so nothing is fetched online. */
:root {
  color-scheme: light;
  --display: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --body: system-ui, -apple-system, 'Segoe UI', sans-serif;
  --bg: #f3f5fa;
  --surface: #ffffff;
  --ink: #141b34;
  --muted: #5b6480;
  --line: #dde2ee;
  --accent: #2748d9;
  --accent-ink: #ffffff;
  --accent-soft: #e6ebfd;
  --warn: #b3261e;
  --ok: #1b7a4b;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1426; --surface: #171e36; --ink: #e9ecf8; --muted: #98a1c0; --line: #2a3354;
    --accent: #7f97ff; --accent-ink: #0f1426; --accent-soft: #212b52; --warn: #ff8a80; --ok: #5fd39a;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  padding-top: max(16px, env(safe-area-inset-top, 0px));
  padding-bottom: max(40px, calc(env(safe-area-inset-bottom, 0px) + 24px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, p { margin: 0; }
[hidden] { display: none !important; }

.app { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top h1 { font-family: var(--display); font-size: 1.75rem; font-weight: 700; letter-spacing: -0.01em; }
.sub { font-size: 0.8125rem; color: var(--muted); }

.btn {
  appearance: none; cursor: pointer; border: 1px solid var(--line); background: var(--surface);
  padding: 9px 14px; border-radius: 8px; font-size: 0.9375rem; font-weight: 500; line-height: 1.2;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--warn); }
.btn.big { padding: 13px 22px; font-size: 1rem; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
.chip {
  appearance: none; cursor: pointer; flex: none; display: inline-flex; gap: 8px; align-items: center;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; white-space: nowrap;
}
.chip.on { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.chip .n { font-size: 0.8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab {
  appearance: none; cursor: pointer; background: none; border: 0; border-bottom: 3px solid transparent;
  padding: 8px 16px; font-weight: 600; color: var(--muted); margin-bottom: -1px;
}
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.empty { padding: 24px 0; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; color: var(--muted); }
.empty strong { color: var(--ink); font-family: var(--display); font-size: 1.25rem; font-weight: 600; }

.study { display: flex; flex-direction: column; gap: 16px; }
.progress { font-size: 0.9375rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.card-wrap { perspective: 1200px; }
.card { appearance: none; border: 0; background: none; padding: 0; width: 100%; display: block; cursor: pointer; text-align: left; }
.card-inner { display: grid; transition: transform 0.5s; transform-style: preserve-3d; }
.card.flipped .card-inner { transform: rotateY(180deg); }
.face {
  grid-area: 1 / 1; min-height: 280px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border: 1px solid var(--line); border-radius: 14px; padding: 26px 22px;
  display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 10px; background: var(--surface);
}
.face.back { transform: rotateY(180deg); background: var(--accent-soft); border-color: var(--accent); }
.tag { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.big { font-family: var(--display); font-size: clamp(1.9rem, 8vw, 2.6rem); font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; text-wrap: balance; }
.phon { font-size: 1.125rem; color: var(--accent); overflow-wrap: anywhere; }
.example { font-size: 1.0625rem; overflow-wrap: anywhere; padding-top: 6px; }
.ex-tr { font-size: 0.9375rem; color: var(--muted); overflow-wrap: anywhere; font-style: italic; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.audio-row { display: flex; gap: 8px; flex-wrap: wrap; }
.icon-btn {
  appearance: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line);
  background: var(--surface); border-radius: 8px; padding: 9px 12px; font-size: 0.9375rem; font-weight: 500; line-height: 1.2;
}
.icon-btn svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn.sm { padding: 5px 8px; }
.icon-btn.sm svg { width: 16px; height: 16px; }
.opts { display: flex; gap: 8px 20px; flex-wrap: wrap; font-size: 0.9375rem; color: var(--muted); }
.opts label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.opts input { accent-color: var(--accent); width: 18px; height: 18px; }
.done { padding: 24px 0; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.done strong { font-family: var(--display); font-size: 1.5rem; font-weight: 700; }

.words { display: flex; flex-direction: column; gap: 14px; }
input[type="text"], textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 16px;
}
textarea { resize: vertical; min-height: 96px; }
.word-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.word { display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-top: 1px solid var(--line); }
.word:first-child { border-top: 0; }
.w-main { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; overflow-wrap: anywhere; }
.w-front { font-weight: 600; }
.w-arrow { color: var(--muted); }
.w-back { font-family: var(--display); font-size: 1.1875rem; font-weight: 600; color: var(--accent); }
.w-phon, .w-trn { font-size: 0.9375rem; color: var(--muted); overflow-wrap: anywhere; }
.w-trn { font-style: italic; }
.w-ex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.9375rem; overflow-wrap: anywhere; }
.msg { font-size: 0.9375rem; color: var(--muted); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { font-family: var(--display); font-size: 1.125rem; font-weight: 600; }
.panel details summary { cursor: pointer; color: var(--accent); font-weight: 500; }
.panel details[open] summary { margin-bottom: 10px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 0.9375rem; max-width: calc(100% - 32px); z-index: 20; }

.folder-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 16px; }
.f-title { font-family: var(--display); font-size: 1.5rem; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; text-wrap: balance; }
.f-count { color: var(--muted); font-size: 0.9375rem; font-variant-numeric: tabular-nums; }
select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; min-width: 0; max-width: 100%; }
.btn:disabled { opacity: 0.45; cursor: default; }
.day-bar { display: flex; gap: 8px; align-items: center; max-width: 100%; }
.day-bar select { flex: 1; min-width: 0; }
.folder.deck, .chip.deck { border-color: var(--accent); }
.w-rank { font-size: 0.8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.type-form { display: flex; flex-direction: column; gap: 10px; }
.type-row { display: flex; gap: 8px; }
.type-row input { flex: 1; min-width: 0; }
.accents { display: flex; gap: 6px; flex-wrap: wrap; }
.accent-key { appearance: none; cursor: pointer; min-width: 40px; padding: 8px 0; text-align: center; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; font-size: 1rem; font-weight: 600; }
.accent-key:hover { border-color: var(--accent); }
.result { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 1rem; overflow-wrap: anywhere; }
.result.ok { border-color: var(--ok); color: var(--ok); }
.result.near { border-color: var(--accent); }
.result.bad { border-color: var(--warn); color: var(--warn); }
.opts label.off { opacity: 0.5; cursor: default; }

@media (prefers-reduced-motion: reduce) { .card-inner { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>Mes Mots</h1>
      <p class="sub" id="libInfo"></p>
    </div>
    <button type="button" class="btn" id="importToggle">Importă</button>
  </header>

  <section class="panel" id="importPanel" hidden>
    <h2>Importă biblioteca</h2>
    <p class="msg">Pe laptop sau în pagina Mes Mots din Claude, apasă „Copie de rezervă" și salvează fișierul. Apoi alege-l aici. Biblioteca de pe acest telefon se înlocuiește cu cea din fișier.</p>
    <div class="row">
      <button type="button" class="btn primary" id="pickFile">Alege fișierul</button>
      <input type="file" id="importFile" accept=".json,application/json,text/plain" hidden>
    </div>
    <details>
      <summary>Sau lipește textul copiat</summary>
      <textarea id="pasteBox" placeholder="Lipește aici conținutul copiei de rezervă" aria-label="Textul copiei de rezervă"></textarea>
      <div class="row" style="margin-top:10px"><button type="button" class="btn" id="pasteGo">Verifică textul</button></div>
    </details>
    <div id="confirmBox" hidden>
      <p class="msg" id="confirmText"></p>
      <div class="row" style="margin-top:10px">
        <button type="button" class="btn primary" id="confirmYes">Înlocuiește biblioteca</button>
        <button type="button" class="btn" id="confirmNo">Anulează</button>
      </div>
    </div>
  </section>

  <nav class="chips" id="chips" aria-label="Foldere"></nav>

  <div class="folder-head" id="folderHead"></div>

  <div class="tabs" role="tablist">
    <button type="button" class="tab" role="tab" id="tabStudy" aria-selected="true">Învață</button>
    <button type="button" class="tab" role="tab" id="tabWords" aria-selected="false">Cuvinte</button>
  </div>

  <section id="studyView" aria-labelledby="tabStudy"></section>

  <section id="wordsView" class="words" aria-labelledby="tabWords" hidden>
    <input type="text" id="search" placeholder="Caută în folder" aria-label="Caută cuvinte" autocomplete="off">
    <ul class="word-list" id="wordList"></ul>
    <p class="msg" id="wordsEmpty" hidden></p>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      });
    }
    for (var i = 2; i < arguments.length; i++) {
      var kid = arguments[i];
      if (kid === null || kid === undefined || kid === false) continue;
      el.append(kid);
    }
    return el;
  }

  function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function plural(n) {
    var m = n % 100;
    if (n === 1) return '1 cuvânt';
    if (n === 0) return '0 cuvinte';
    return (m === 0 || m >= 20) ? n + ' de cuvinte' : n + ' cuvinte';
  }

  /* ---------- storage on this phone ---------- */
  var LIB_KEY = 'mes-mots-offline-lib-v1', PREF_KEY = 'mes-mots-offline-prefs-v1', PLAN_KEY = 'mes-mots-offline-plan-v1';
  function lsRead(k) { try { var s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function lsWrite(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }

  var lib = lsRead(LIB_KEY);
  if (!lib || !Array.isArray(lib.folders) || !Array.isArray(lib.cards)) lib = { folders: [], cards: [], importedAt: 0 };
  var prefs = Object.assign({ folder: null, reverse: false, shuffle: true, typing: false, tab: 'study' }, lsRead(PREF_KEY) || {});
  function savePrefs() { lsWrite(PREF_KEY, prefs); }

  var plan = lsRead(PLAN_KEY);
  if (!plan || typeof plan !== 'object') plan = { day: 1, done: {} };
  if (!plan.done || typeof plan.done !== 'object') plan.done = {};
  function getPlan() { return plan; }
  function savePlan() { lsWrite(PLAN_KEY, plan); }
  function ownData() { return lib; }
  var session = null;

  /* ---------- built-in list: the 1500 most frequent words, 30 per day ---------- */
  var DECK_ID = '__deck1500', DAY_SIZE = 30, MAX_DAYS = 50;
  var DECK = null, deckMap = {}, deckState = 'loading';
  var DECK_FOLDER = { id: DECK_ID, name: 'Primele 1500 de cuvinte', deck: true };

  function curFolder() {
    if (prefs.folder === DECK_ID) return DECK_FOLDER;
    var fs = ownData().folders;
    for (var i = 0; i < fs.length; i++) if (fs[i].id === prefs.folder) return fs[i];
    return null;
  }
  function fixCurrent() {
    if (prefs.folder === DECK_ID) return;
    if (!curFolder()) { prefs.folder = DECK_ID; savePrefs(); }
  }
  function cardsIn(fid) {
    if (fid === DECK_ID) return dayCards(curDay());
    return ownData().cards.filter(function (c) { return c.folder === fid; });
  }
  function cardById(id) {
    var cs = ownData().cards;
    for (var i = 0; i < cs.length; i++) if (cs[i].id === id) return cs[i];
    return deckMap[id] || null;
  }

  function totalDays() { return DECK ? Math.ceil(DECK.length / DAY_SIZE) : MAX_DAYS; }
  function curDay() {
    var n = Math.floor(Number(getPlan().day)) || 1;
    return Math.min(Math.max(1, n), totalDays());
  }
  function dayCards(n) { return DECK ? DECK.slice((n - 1) * DAY_SIZE, n * DAY_SIZE) : []; }
  function dayRange(n) {
    var a = (n - 1) * DAY_SIZE + 1, b = Math.min(n * DAY_SIZE, DECK ? DECK.length : 1500);
    return a + '–' + b;
  }

  function loadDeck() {
    fetch('deck.json').then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function (rows) {
      if (!Array.isArray(rows) || !rows.length) throw new Error('empty');
      DECK = rows.map(function (r) { return { id: 'd' + r[0], rank: r[0], back: r[1], front: r[2], phon: r[3], example: r[4], exTr: r[5] }; });
      DECK.forEach(function (c) { deckMap[c.id] = c; });
      deckState = 'ready'; session = null;
      renderAll();
    }).catch(function () {
      deckState = 'error';
      renderAll();
    });
  }

  function setDay(d) {
    var n = Math.min(Math.max(1, d), totalDays());
    getPlan().day = n;
    savePlan();
    session = null;
    $('search').value = '';
    renderAll();
  }

  function markDayDone(d) {
    var p = getPlan();
    if (!p.done[d]) { p.done[d] = true; savePlan(); renderHead(); renderFolders(); }
  }

  function renderDeckHead(box) {
    var day = curDay(), n = totalDays(), done = !!getPlan().done[day];
    var sel = h('select', { id: 'daySel', 'aria-label': 'Alege ziua' });
    for (var d = 1; d <= n; d++) {
      var o = h('option', { value: String(d), text: 'Ziua ' + d + ' · ' + dayRange(d) + (getPlan().done[d] ? ' ✓' : '') });
      if (d === day) o.selected = true;
      sel.append(o);
    }
    sel.addEventListener('change', function () { setDay(Number(sel.value)); });
    box.append(
      h('div', null,
        h('h2', { class: 'f-title', text: 'Primele 1500 de cuvinte' }),
        h('p', { class: 'f-count', text: 'Ziua ' + day + ' din ' + n + ' · cuvintele ' + dayRange(day) + (done ? ' · terminată ✓' : '') })),
      h('div', { class: 'day-bar' },
        h('button', { type: 'button', class: 'btn', text: '‹', 'aria-label': 'Ziua anterioară', disabled: day <= 1, onclick: function () { setDay(day - 1); } }),
        sel,
        h('button', { type: 'button', class: 'btn', text: '›', 'aria-label': 'Ziua următoare', disabled: day >= n, onclick: function () { setDay(day + 1); } })));
  }

  function deckFolderItem(asChip) {
    var on = prefs.folder === DECK_ID;
    var label = asChip ? '1500 de cuvinte' : 'Primele 1500';
    var cnt = 'Ziua ' + curDay();
    if (asChip) {
      return h('button', { type: 'button', class: 'chip deck' + (on ? ' on' : ''), 'aria-current': on ? 'true' : null, onclick: function () { selectFolder(DECK_ID); } },
        label, h('span', { class: 'n', text: cnt }));
    }
    return h('li', null,
      h('button', { type: 'button', class: 'folder deck' + (on ? ' on' : ''), 'aria-current': on ? 'true' : null, onclick: function () { selectFolder(DECK_ID); } },
        h('span', { class: 'fname', text: label }),
        h('span', { class: 'count', text: cnt })));
  }

  function wordLi(c, actions) {
    return h('li', { class: 'word' },
      h('div', { class: 'w-main' },
        c.rank ? h('span', { class: 'w-rank', text: '#' + c.rank }) : null,
        h('span', { class: 'w-front', text: c.front }),
        h('span', { class: 'w-arrow', 'aria-hidden': 'true', text: '→' }),
        h('span', { class: 'w-back', lang: 'fr', text: c.back }),
        TTS_OK ? speakBtn('Ascultă cuvântul: ' + c.back, c.back, null, true) : null),
      c.phon ? h('div', { class: 'w-phon', text: c.phon }) : null,
      c.example ? h('div', { class: 'w-ex' },
        h('span', { lang: 'fr', text: c.example }),
        TTS_OK ? speakBtn('Ascultă propoziția', c.example, null, true) : null) : null,
      c.example && c.exTr ? h('div', { class: 'w-trn', text: c.exTr }) : null,
      actions || null);
  }

  /* the words tab for the built-in list: this day's words, or a search over all 1500 */
  function renderDeckWords(list, empty) {
    var sr = $('searchRow');
    if (sr) sr.hidden = false;
    $('search').placeholder = 'Caută în toate cele 1500 de cuvinte';
    if (deckState !== 'ready') {
      empty.hidden = false;
      empty.textContent = deckState === 'error' ? 'Lista nu s-a încărcat. Verifică conexiunea la internet și reîncarcă pagina.' : 'Se încarcă lista…';
      return;
    }
    var q = norm($('search').value.trim());
    var pool = q ? DECK.filter(function (c) { return norm(c.front + ' ' + c.back).indexOf(q) !== -1; }) : dayCards(curDay());
    var shown = pool.slice(0, 60);
    shown.forEach(function (c) { list.append(wordLi(c, null)); });
    if (!shown.length) { empty.hidden = false; empty.textContent = 'Niciun cuvânt nu se potrivește cu căutarea.'; }
    else if (pool.length > shown.length) { empty.hidden = false; empty.textContent = 'Sunt ' + pool.length + ' rezultate. Se arată primele 60.'; }
    else { empty.hidden = true; }
  }

  var toastTimer;
  function toast(text) {
    var el = $('toast');
    el.textContent = text; el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 4000);
  }

  /* ---------- text to speech (uses a French voice installed on the phone, works offline) ---------- */
  var TTS_OK = 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance === 'function';

  function speakerIcon() {
    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('aria-hidden', 'true');
    ['M4 9v6h4l5 4V5L8 9H4z', 'M16 9a4 4 0 0 1 0 6', 'M18.5 6.5a8 8 0 0 1 0 11'].forEach(function (d) {
      var p = document.createElementNS(ns, 'path');
      p.setAttribute('d', d);
      svg.append(p);
    });
    return svg;
  }

  function speakBtn(label, text, id, small) {
    return h('button', { type: 'button', class: 'icon-btn' + (small ? ' sm' : ''), id: id || null, 'aria-label': label, title: label,
      onclick: function () { speak(text); } }, speakerIcon(), small ? null : label);
  }

  function pickFrVoice(list) {
    var fr = null;
    for (var i = 0; i < list.length; i++) {
      var l = String(list[i].lang || '').toLowerCase().replace('_', '-');
      if (l === 'fr-fr') return list[i];
      if (!fr && l.indexOf('fr') === 0) fr = list[i];
    }
    return fr;
  }

  function speak(text) {
    if (!TTS_OK || !text) return;
    var synth = window.speechSynthesis;
    var list = [];
    try { list = synth.getVoices() || []; } catch (e) { list = []; }
    var voice = pickFrVoice(list);
    if (list.length && !voice) {
      toast('Nu am găsit o voce franceză pe acest telefon. O poți adăuga din Setări, Accesibilitate, Conținut vorbit, Voci.');
      return;
    }
    try { synth.cancel(); } catch (e) { /* nothing to cancel */ }
    var u = new window.SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    if (voice) u.voice = voice;
    u.rate = 0.9;
    u.onerror = function (ev) {
      if (ev && (ev.error === 'interrupted' || ev.error === 'canceled')) return;
      toast('Nu am putut reda sunetul.');
    };
    try { synth.speak(u); } catch (e) { toast('Nu am putut reda sunetul.'); }
  }

  /* ---------- folders ---------- */
  function renderInfo() {
    var el = $('libInfo');
    if (!lib.cards.length) { el.textContent = 'Lista de 1500 de cuvinte e inclusă'; return; }
    var d = lib.importedAt ? new Date(lib.importedAt) : null;
    var when = d && !isNaN(d) ? ' · importate ' + d.toLocaleDateString('ro-RO', { day: 'numeric', month: 'short' }) : '';
    el.textContent = '1500 de cuvinte + ' + plural(lib.cards.length) + ' ale tale' + when;
  }

  function selectFolder(id) {
    prefs.folder = id; savePrefs(); session = null; $('search').value = '';
    renderAll();
  }

  function renderChips() {
    var nav = $('chips');
    nav.textContent = '';
    nav.append(deckFolderItem(true));
    lib.folders.forEach(function (f) {
      var on = f.id === prefs.folder;
      nav.append(h('button', { type: 'button', class: 'chip' + (on ? ' on' : ''), 'aria-current': on ? 'true' : null,
        onclick: function () { selectFolder(f.id); } },
        f.name, h('span', { class: 'n', text: String(cardsIn(f.id).length) })));
    });
  }
  function renderFolders() { renderChips(); }

  function renderHead() {
    var box = $('folderHead');
    box.textContent = '';
    var f = curFolder();
    if (f && f.deck) renderDeckHead(box);
  }

  /* ---------- tabs ---------- */
  function setTab(t) { prefs.tab = t; savePrefs(); renderTabs(); if (t === 'study') renderStudy(); }
  function renderTabs() {
    var study = prefs.tab !== 'words';
    $('tabStudy').setAttribute('aria-selected', study ? 'true' : 'false');
    $('tabWords').setAttribute('aria-selected', study ? 'false' : 'true');
    $('studyView').hidden = !study;
    $('wordsView').hidden = study;
  }
  $('tabStudy').addEventListener('click', function () { setTab('study'); });
  $('tabWords').addEventListener('click', function () { setTab('words'); });

  /* ---------- study ---------- */
  function startSession() {
    var f = curFolder();
    var ids = cardsIn(prefs.folder).map(function (c) { return c.id; });
    if (prefs.shuffle) shuffle(ids);
    session = { folder: prefs.folder, day: f && f.deck ? curDay() : 0, queue: ids, flipped: false, total: ids.length, again: 0 };
  }

  function isTyping() { return !!prefs.typing; }
  function isRev() { return !!prefs.reverse && !prefs.typing; }

  function setFlipped(v) {
    if (!session) return;
    session.flipped = v;
    var card = $('flipCard');
    if (!card) return;
    card.classList.toggle('flipped', v);
    var f = card.querySelector('.front'), b = card.querySelector('.back');
    if (f) f.setAttribute('aria-hidden', v ? 'true' : 'false');
    if (b) b.setAttribute('aria-hidden', v ? 'false' : 'true');
    $('showBtn').hidden = v || isTyping();
    $('answerRow').hidden = !v;
    var tb = $('typeBox'); if (tb) tb.hidden = v;
    var rm = $('resultMsg'); if (rm && !v) rm.hidden = true;
    var wa = $('wordAudio'), sa = $('sentAudio');
    if (wa) wa.hidden = !(v || isRev());
    if (sa) sa.hidden = !v;
  }

  function answer(known) {
    if (!session || !session.queue.length) return;
    var id = session.queue.shift();
    if (!known) { session.again++; session.queue.push(id); }
    session.flipped = false;
    if (session.folder === DECK_ID && !session.queue.length) markDayDone(session.day);
    renderStudy();
  }

  /* ---- typed answers ---- */
  function cleanFr(s) {
    return String(s || '').toLowerCase().replace(/[’‘`´]/g, "'").replace(/œ/g, 'oe').replace(/\s+/g, ' ').trim().replace(/[.!?,;:]+$/, '');
  }
  function stripAcc(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function answerVariants(back) {
    var b = cleanFr(back), out = [b];
    var m = b.replace(/^(le |la |les |l'|un |une |des |du |de la |de l'|d')/, '');
    if (m && m !== b) out.push(m);
    return out;
  }
  function gradeTyped(typed, back) {
    var t = cleanFr(typed);
    if (!t) return 'empty';
    var vs = answerVariants(back), i;
    for (i = 0; i < vs.length; i++) if (t === vs[i]) return 'ok';
    var ts = stripAcc(t);
    for (i = 0; i < vs.length; i++) if (ts === stripAcc(vs[i])) return 'near';
    return 'bad';
  }

  function showResult(kind, c, typed) {
    var el = $('resultMsg');
    if (!el) return;
    var msg, cls;
    if (kind === 'ok') { msg = 'Corect!'; cls = 'ok'; }
    else if (kind === 'near') { msg = 'Aproape, verifică accentele. Corect: ' + c.back; cls = 'near'; }
    else if (kind === 'skip') { msg = 'Răspunsul: ' + c.back; cls = 'near'; }
    else { msg = 'Ai scris „' + typed.trim() + '”. Corect: ' + c.back; cls = 'bad'; }
    el.textContent = msg;
    el.className = 'result ' + cls;
    el.hidden = false;
    setFlipped(true);
  }

  var ACCENTS = ['é', 'è', 'ê', 'ë', 'à', 'â', 'ç', 'ù', 'û', 'î', 'ï', 'ô', 'œ'];
  function insertAccent(inp, ch) {
    var s = inp.selectionStart == null ? inp.value.length : inp.selectionStart;
    var e = inp.selectionEnd == null ? s : inp.selectionEnd;
    inp.value = inp.value.slice(0, s) + ch + inp.value.slice(e);
    var pos = s + ch.length;
    inp.focus();
    try { inp.setSelectionRange(pos, pos); } catch (err) { /* not supported */ }
  }

  function buildTypeBox(c) {
    var inp = h('input', { type: 'text', id: 'typeInput', lang: 'fr', autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false',
      enterkeyhint: 'done', placeholder: 'Scrie cuvântul în franceză', 'aria-label': 'Scrie cuvântul în franceză' });
    var keys = h('div', { class: 'accents', role: 'group', 'aria-label': 'Litere cu accent' });
    ACCENTS.forEach(function (ch) {
      var b = h('button', { type: 'button', class: 'accent-key', text: ch, 'aria-label': 'Inserează ' + ch });
      b.addEventListener('mousedown', function (e) { e.preventDefault(); });
      b.addEventListener('click', function () { insertAccent(inp, ch); });
      keys.append(b);
    });
    return h('form', { class: 'type-form', id: 'typeBox', onsubmit: function (e) {
      e.preventDefault();
      var kind = gradeTyped(inp.value, c.back);
      if (kind === 'empty') { inp.focus(); return; }
      showResult(kind, c, inp.value);
    } },
      h('div', { class: 'type-row' }, inp, h('button', { type: 'submit', class: 'btn primary', text: 'Verifică' })),
      keys,
      h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn', text: 'Nu știu', onclick: function () { showResult('skip', c, ''); } })));
  }

  function restartSession() { startSession(); renderStudy(); }

  function renderStudy() {
    var box = $('studyView');
    box.textContent = '';
    var f = curFolder();
    if (!f) { box.append(emptyFolderView(null)); return; }
    if (f.deck && deckState !== 'ready') {
      box.append(h('div', { class: 'empty' },
        h('strong', { text: deckState === 'error' ? 'Lista nu s-a încărcat' : 'Se încarcă lista…' }),
        deckState === 'error' ? h('p', { text: 'Verifică conexiunea la internet și reîncarcă pagina.' }) : null));
      return;
    }
    var cards = cardsIn(f.id);
    if (!cards.length) { box.append(emptyFolderView(f)); return; }
    if (!session || session.folder !== f.id || (f.deck && session.day !== curDay())) startSession();
    session.queue = session.queue.filter(function (id) { return !!cardById(id); });
    var typing = isTyping(), rev = isRev();

    if (!session.queue.length) {
      var day = curDay(), more = f.deck && day < totalDays();
      box.append(h('div', { class: 'done' },
        h('strong', { text: f.deck ? 'Gata, ai terminat ziua ' + session.day : 'Gata, ai terminat folderul' }),
        h('p', { text: 'Ai parcurs ' + plural(session.total) + '. Ai apăsat „Mai repet” de ' + session.again + (session.again === 1 ? ' dată.' : ' ori.') }),
        more ? h('button', { type: 'button', class: 'btn primary big', text: 'Treci la ziua ' + (day + 1), onclick: function () { setDay(day + 1); } }) : null,
        h('button', { type: 'button', class: more ? 'btn' : 'btn primary big', text: f.deck ? 'Repetă ziua' : 'Începe din nou', onclick: restartSession })));
      return;
    }

    var c = cardById(session.queue[0]);
    var front = h('div', { class: 'face front', 'aria-hidden': 'false' },
      h('span', { class: 'tag', text: rev ? 'Franceză' : 'Română / engleză' }),
      h('p', { class: 'big', text: rev ? c.back : c.front }),
      rev && c.phon ? h('p', { class: 'phon', text: c.phon }) : null);
    var back = h('div', { class: 'face back', 'aria-hidden': 'true' },
      h('span', { class: 'tag', text: rev ? 'Română / engleză' : 'Franceză' }),
      h('p', { class: 'big', text: rev ? c.front : c.back }),
      !rev && c.phon ? h('p', { class: 'phon', text: c.phon }) : null,
      c.example ? h('p', { class: 'example', lang: 'fr', text: c.example }) : null,
      c.example && c.exTr ? h('p', { class: 'ex-tr', text: c.exTr }) : null);

    var card = h('button', { type: 'button', class: 'card', id: 'flipCard', 'aria-label': 'Întoarce cardul', onclick: function () {
      if (typing && !session.flipped) showResult('skip', c, ''); else setFlipped(!session.flipped);
    } }, h('div', { class: 'card-inner' }, front, back));

    var showBtn = h('button', { type: 'button', class: 'btn primary big', id: 'showBtn', text: 'Arată răspunsul', onclick: function () { setFlipped(true); } });
    var answerRow = h('div', { class: 'actions', id: 'answerRow', hidden: true },
      h('button', { type: 'button', class: 'btn big danger', text: 'Mai repet', onclick: function () { answer(false); } }),
      h('button', { type: 'button', class: 'btn big primary', text: 'Știam', onclick: function () { answer(true); } }));

    var audioRow = TTS_OK ? h('div', { class: 'audio-row' },
      speakBtn('Ascultă cuvântul', c.back, 'wordAudio', false),
      c.example ? speakBtn('Ascultă propoziția', c.example, 'sentAudio', false) : null) : null;

    var optType = h('input', { type: 'checkbox', id: 'optType', checked: typing ? true : null });
    optType.addEventListener('change', function () { prefs.typing = optType.checked; savePrefs(); renderStudy(); });
    var optRev = h('input', { type: 'checkbox', id: 'optRev', checked: rev ? true : null, disabled: typing ? true : null });
    optRev.addEventListener('change', function () { prefs.reverse = optRev.checked; savePrefs(); renderStudy(); });
    var optShuf = h('input', { type: 'checkbox', id: 'optShuf', checked: prefs.shuffle ? true : null });
    optShuf.addEventListener('change', function () { prefs.shuffle = optShuf.checked; savePrefs(); startSession(); renderStudy(); });

    box.append(h('div', { class: 'study' },
      h('p', { class: 'progress', text: (f.deck ? 'Ziua ' + session.day + ' · mai ai ' : 'Mai ai ') + plural(session.queue.length) + ' de văzut' }),
      h('div', { class: 'card-wrap' }, card),
      typing ? buildTypeBox(c) : null,
      h('p', { id: 'resultMsg', class: 'result', role: 'status', hidden: true }),
      h('div', { class: 'actions' }, showBtn, answerRow),
      audioRow,
      typing ? null : h('p', { class: 'hint', text: 'Space întoarce cardul. După răspuns: săgeată dreapta = Știam, stânga = Mai repet.' }),
      h('div', { class: 'opts' },
        h('label', null, optType, 'Scrie cuvântul în franceză'),
        h('label', { class: typing ? 'off' : null }, optRev, 'Începe cu franceza'),
        h('label', null, optShuf, 'Amestecă cardurile')),
      f.deck ? h('p', { class: 'hint', text: 'Cuvintele vin din lista de frecvență lingvoberry.com/wordlist/fr. Traducerile, pronunția și exemplele sunt generate de Claude și pot conține greșeli.' }) : null));
    setFlipped(session.flipped);
    if (typing && !session.flipped) {
      setTimeout(function () {
        var i = $('typeInput');
        if (i) { try { i.focus({ preventScroll: true }); } catch (e) { i.focus(); } }
      }, 0);
    }
  }

  document.addEventListener('keydown', function (e) {
    if (prefs.tab === 'words' || !session || !session.queue.length) return;
    var t = e.target && e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' || t === 'BUTTON') return;
    if (!isTyping() && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); setFlipped(!session.flipped); }
    else if (e.key === 'ArrowRight' && session.flipped) answer(true);
    else if (e.key === 'ArrowLeft' && session.flipped) answer(false);
  });

  function emptyFolderView(f) {
    return h('div', { class: 'empty' }, h('strong', { text: 'Folderul e gol' }),
      h('p', { text: 'Alege alt folder sau importă o copie de rezervă nouă.' }));
  }

  /* ---------- word list ---------- */
  function renderWords() {
    var list = $('wordList'), empty = $('wordsEmpty');
    list.textContent = '';
    var f = curFolder();
    if (!f) { empty.hidden = true; $('search').hidden = true; return; }
    if (f.deck) { $('search').hidden = false; renderDeckWords(list, empty); return; }
    $('search').placeholder = 'Caută în folder';
    var all = cardsIn(f.id);
    $('search').hidden = all.length < 2;
    var q = norm($('search').value.trim());
    var shown = q ? all.filter(function (c) { return norm(c.front + ' ' + c.back + ' ' + (c.example || '')).indexOf(q) !== -1; }) : all;
    if (!shown.length) {
      empty.hidden = false;
      empty.textContent = all.length ? 'Niciun cuvânt nu se potrivește cu căutarea.' : 'Folderul e gol.';
    } else empty.hidden = true;
    shown.forEach(function (c) { list.append(wordLi(c, null)); });
  }
  $('search').addEventListener('input', renderWords);

  /* ---------- import ---------- */
  var pending = null;

  function sanitize(d) {
    var s = function (v, n) { return typeof v === 'string' ? v.trim().slice(0, n) : ''; };
    var folders = [], ids = {};
    d.folders.forEach(function (f) {
      if (f && typeof f.id === 'string' && f.id && !ids[f.id]) {
        ids[f.id] = true;
        folders.push({ id: f.id.slice(0, 40), name: s(f.name, 60) || 'Folder' });
      }
    });
    var cards = [], seen = {};
    d.cards.forEach(function (c) {
      if (c && typeof c.id === 'string' && c.id && !seen[c.id] && ids[c.folder] && s(c.front, 1) && s(c.back, 1)) {
        seen[c.id] = true;
        cards.push({ id: c.id.slice(0, 40), folder: c.folder, front: s(c.front, 200), back: s(c.back, 200), phon: s(c.phon, 200), example: s(c.example, 500), exTr: s(c.exTr, 500) });
      }
    });
    return { folders: folders, cards: cards };
  }

  function proposeImport(text) {
    try {
      var d = JSON.parse(String(text));
      if (!d || !Array.isArray(d.folders) || !Array.isArray(d.cards)) throw new Error('shape');
      var clean = sanitize(d);
      if (!clean.cards.length) throw new Error('empty');
      pending = clean;
      $('confirmText').textContent = 'Fișierul are ' + clean.folders.length + (clean.folders.length === 1 ? ' folder' : ' foldere') + ' și ' + plural(clean.cards.length) +
        '. Biblioteca de pe acest telefon va fi înlocuită.';
      $('confirmBox').hidden = false;
    } catch (e) {
      pending = null;
      $('confirmBox').hidden = true;
      toast('Textul nu pare a fi o copie de rezervă Mes Mots.');
    }
  }

  $('importToggle').addEventListener('click', function () {
    var p = $('importPanel');
    p.hidden = !p.hidden;
    if (p.hidden) { pending = null; $('confirmBox').hidden = true; }
  });
  $('pickFile').addEventListener('click', function () { $('importFile').click(); });
  $('importFile').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () { proposeImport(reader.result); };
    reader.onerror = function () { toast('Nu am putut citi fișierul.'); };
    reader.readAsText(file);
  });
  $('pasteGo').addEventListener('click', function () { proposeImport($('pasteBox').value); });
  $('confirmNo').addEventListener('click', function () { pending = null; $('confirmBox').hidden = true; });
  $('confirmYes').addEventListener('click', function () {
    if (!pending) return;
    var next = { folders: pending.folders, cards: pending.cards, importedAt: Date.now() };
    if (!lsWrite(LIB_KEY, next)) { toast('Nu am putut salva pe acest telefon. Verifică spațiul liber.'); return; }
    lib = next;
    pending = null; session = null;
    $('confirmBox').hidden = true; $('importPanel').hidden = true; $('pasteBox').value = '';
    fixCurrent();
    renderAll();
    toast('Gata: ' + plural(lib.cards.length) + ' pe acest telefon.');
  });

  /* ---------- go ---------- */
  function renderAll() { renderInfo(); renderChips(); renderHead(); renderTabs(); renderStudy(); renderWords(); }

  fixCurrent();
  renderAll();
  loadDeck();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* works online anyway */ });
    });
  }
})();
</script>
</body>
</html>
